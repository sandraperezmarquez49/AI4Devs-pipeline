name: LTI Pipeline - Backend Deploy (Improved)

# Trigger: Push a una rama con Pull Request abierto
on:
  push:
    branches:
      - pipeline-solved-sp
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  # Job 1: Tests de Backend
  test-backend:
    name: 🧪 Tests de Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependencias backend
        run: |
          cd backend
          npm ci

      - name: 🗄️ Configurar base de datos de test
        run: |
          cd backend
          echo "DATABASE_URL=\"postgresql://postgres:postgres@localhost:5432/test_db\"" > .env
          npx prisma generate
          # Aplicar schema a la base de datos de test
          npx prisma db push --accept-data-loss

      - name: 🧪 Ejecutar tests de backend
        run: |
          cd backend
          npm test

  # Job 2: Build de Backend
  build-backend:
    name: 🏗️ Build de Backend
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependencias backend
        run: |
          cd backend
          npm ci

      - name: 🏗️ Compilar backend
        run: |
          cd backend
          npm run build

      - name: 📦 Crear artefacto de build
        run: |
          cd backend
          # Crear directorio temporal para el build
          mkdir -p ../build-temp
          cp -r dist/ ../build-temp/
          cp -r prisma/ ../build-temp/
          cp package.json package-lock.json ../build-temp/
          
          # Copiar node_modules excluyendo archivos problemáticos
          rsync -av --exclude='.bin' --exclude='.cache' --exclude='*.log' node_modules/ ../build-temp/node_modules/
          
          # Crear tar.gz del directorio temporal
          cd ../build-temp
          tar -czf ../backend/backend-build.tar.gz .
          cd ../backend

      - name: 💾 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/backend-build.tar.gz
          retention-days: 1

  # Job 3: Despliegue en EC2 (Mejorado con easingthemes/ssh-deploy)
  deploy-backend:
    name: 🚀 Despliegue en EC2
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/pipeline-solved-sp'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Descargar artefacto de build
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./build-artifact

      - name: 🗄️ Configurar PostgreSQL en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Actualizar sistema
            sudo dnf update -y

            # Instalar PostgreSQL
            sudo dnf install -y postgresql15-server postgresql15

            # Verificar si PostgreSQL ya está configurado
            if [ ! -d "/var/lib/pgsql/data" ] || [ ! "$(ls -A /var/lib/pgsql/data)" ]; then
              echo "=== Inicializando PostgreSQL por primera vez ==="
              sudo postgresql-setup --initdb
            else
              echo "=== PostgreSQL ya está configurado, saltando inicialización ==="
            fi
            
            # Habilitar y iniciar PostgreSQL
            sudo systemctl enable postgresql
            sudo systemctl start postgresql
            
            # Esperar a que PostgreSQL esté completamente iniciado
            echo "=== Esperando a que PostgreSQL esté listo ==="
            sleep 10
            sudo systemctl status postgresql
            sudo -u postgres pg_isready -h localhost -p 5432 || echo "PostgreSQL no está listo aún"

            # Configurar usuario y base de datos
            echo "=== Configurando usuario y base de datos ==="
            # Usar sudo -u postgres para evitar problemas de autenticación
            sudo -u postgres psql -c "DROP USER IF EXISTS LTIdbUser;" || echo "Usuario no existía"
            sudo -u postgres psql -c "CREATE USER LTIdbUser WITH PASSWORD 'D1ymf8wyQEGthFR1E9xhCq';"
            sudo -u postgres psql -c "DROP DATABASE IF EXISTS LTIdb;" || echo "Base de datos no existía"
            sudo -u postgres psql -c "CREATE DATABASE LTIdb OWNER LTIdbUser;"
            sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE LTIdb TO LTIdbUser;"
            sudo -u postgres psql -c "ALTER USER LTIdbUser CREATEDB;"
            sudo -u postgres psql -c "ALTER USER LTIdbUser WITH SUPERUSER;"
            
            # Verificar que el usuario puede conectarse
            echo "=== Verificando conexión del usuario ==="
            sudo -u postgres psql -c "SELECT usename FROM pg_user WHERE usename = 'LTIdbUser';"
            
            # Verificar que el usuario y base de datos se crearon correctamente
            echo "=== Verificando configuración ==="
            sudo -u postgres psql -c "\du" | grep LTIdbUser || echo "Usuario LTIdbUser no encontrado"
            sudo -u postgres psql -c "\l" | grep LTIdb || echo "Base de datos LTIdb no encontrada"

            # Configurar PostgreSQL para conexiones externas
            echo "=== Configurando PostgreSQL para conexiones externas ==="
            sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/" /var/lib/pgsql/data/postgresql.conf
            sudo sed -i "s/local   all             all                                     peer/local   all             all                                     md5/" /var/lib/pgsql/data/pg_hba.conf
            echo "host    all             all             0.0.0.0/0               md5" | sudo tee -a /var/lib/pgsql/data/pg_hba.conf
            echo "host    all             all             127.0.0.1/32            md5" | sudo tee -a /var/lib/pgsql/data/pg_hba.conf

            # Reiniciar PostgreSQL
            echo "=== Reiniciando PostgreSQL ==="
            sudo systemctl restart postgresql
            sleep 5
            sudo systemctl status postgresql
            
            # Verificar que PostgreSQL esté funcionando
            echo "=== Verificando PostgreSQL ==="
            sudo -u postgres pg_isready -h localhost -p 5432
            echo "PostgreSQL configurado exitosamente"

      - name: 🚀 Desplegar backend con easingthemes/ssh-deploy
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          TARGET: /home/${{ secrets.EC2_USER }}/lti-backend
          SOURCE: "./build-artifact/"

      - name: 🔧 Configurar y ejecutar aplicación
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/lti-backend

            # Crear archivo .env
            cat > .env << 'ENVEOF'
            DATABASE_URL="postgresql://LTIdbUser:D1ymf8wyQEGthFR1E9xhCq@localhost:5432/LTIdb"
            HOST=0.0.0.0
            PORT=3010
            NODE_ENV=production
            ENVEOF

            # Extraer build
            tar -xzf backend-build.tar.gz --ignore-failed-read || true

            # Generar cliente Prisma
            npx prisma generate

            # Verificar conexión antes de aplicar esquema
            echo "=== Verificando conexión a base de datos ==="
            sudo -u postgres psql -c "SELECT 1;" || echo "Error de conexión con postgres"
            PGPASSWORD=D1ymf8wyQEGthFR1E9xhCq psql -h localhost -U LTIdbUser -d LTIdb -c "SELECT 1;" || echo "Error de conexión con LTIdbUser"
            
            # Aplicar esquema a base de datos
            echo "=== Aplicando esquema a base de datos ==="
            echo "DATABASE_URL actual: $DATABASE_URL"
            npx prisma db push --accept-data-loss --force-reset
            echo "=== Esquema aplicado exitosamente ==="

            # Detener proceso anterior si existe
            pkill -f "node.*3010" || true

            # Iniciar aplicación en background
            nohup npm start > backend.log 2>&1 &

            # Esperar y verificar que esté funcionando
            sleep 10
            curl -f http://localhost:3010/ || exit 1

            echo "Backend desplegado exitosamente en puerto 3010"

      - name: ✅ Verificar despliegue
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Verificar que el proceso esté ejecutándose
            ps aux | grep -E "node.*3010" | grep -v grep

            # Verificar que responda
            curl -f http://localhost:3010/ && echo "✅ Backend funcionando correctamente"

            # Mostrar logs recientes
            echo "📋 Logs recientes:"
            tail -20 /home/${{ secrets.EC2_USER }}/lti-backend/backend.log || echo "No hay logs aún"

  # Job 4: Notificación de resultado
  notify:
    name: 📢 Notificación
    runs-on: ubuntu-latest
    needs: [test-backend, build-backend, deploy-backend]
    if: always()

    steps:
      - name: ✅ Pipeline completado
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "success" ]; then
            echo "🎉 Pipeline completado exitosamente!"
            echo "✅ Tests: ${{ needs.test-backend.result }}"
            echo "✅ Build: ${{ needs.build-backend.result }}"
            echo "✅ Deploy: ${{ needs.deploy-backend.result }}"
          else
            echo "❌ Pipeline falló en: ${{ needs.deploy-backend.result }}"
            exit 1
          fi